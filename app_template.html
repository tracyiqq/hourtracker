<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hours Ledger</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hours">
<meta name="theme-color" content="#141A24">
<meta name="format-detection" content="telephone=no">
<!-- The page loads nothing and talks to nothing. connect-src 'none' is the
     important one: even if a script were injected, it has nowhere to send data. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src 'none'; connect-src 'none'; object-src 'none'; media-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">

<style>
:root{
  --ink:#141A24; --ink-2:#3A4356; --ink-3:#6C7689;
  --rule:#D4D9E1; --rule-soft:#E8EBF0; --paper:#EFF2F6; --surface:#FFFFFF;
  --marigold:#E09B2D; --green:#006400; --red:#C00000; --jade:#12836A;
  --display:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
  --tabh:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation}          /* no double-tap zoom; pan and pinch still work */
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;padding:0;height:100%;background:#fff}
/* iOS reports several different "full heights" in a standalone app; take the
   largest available so nothing is left over at the bottom */
html{height:-webkit-fill-available}
body{font-family:var(--display);font-size:15px;color:var(--ink);background:#fff;
  -webkit-font-smoothing:antialiased;overflow:hidden;width:100%;
  height:100%;min-height:-webkit-fill-available;
  padding:0;overscroll-behavior:none}
/* fixed inset beats any height unit: no dvh rounding, no gap under the tab bar */
#app{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;background:var(--paper);
  display:flex;flex-direction:column;overflow:hidden;
  height:100%;height:-webkit-fill-available;height:100dvh}
/* the phone frame is a desktop-preview affordance only */
@media (min-width:560px) and (min-height:640px) and (hover:hover) and (pointer:fine){
  body{background:#20252F;display:flex;align-items:center;justify-content:center}
  #app{position:relative;inset:auto;width:100%;max-width:412px;height:min(100dvh,880px);
    border-radius:34px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
}
/* installed to the Home Screen: never a frame, always edge to edge */
@media (display-mode:standalone),(display-mode:fullscreen){
  html,body{background:#fff}
  body{display:block}
  #app{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;max-width:none;
    height:100%;height:-webkit-fill-available;height:100dvh;
    border-radius:0;box-shadow:none}
}

.topbar{flex:none;background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 14px 14px;
  display:flex;align-items:center;gap:8px}
.topbar .mbtn{width:38px;height:38px;flex:none;border:0;border-radius:11px;background:#242C3A;color:#fff;
  font-family:var(--mono);font-size:17px;cursor:pointer}
.topbar .mbtn:active{background:#323C4E}
.mtitle{flex:1;text-align:center}
.mtitle b{display:block;font-size:16px;font-weight:600}
.mtitle span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#8E99AD;margin-top:2px}
.gear{width:38px;height:38px;border:0;background:transparent;color:#8E99AD;cursor:pointer;padding:8px}
.gear svg{width:22px;height:22px;display:block}

.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 28px;
  overscroll-behavior:contain}
.screen::-webkit-scrollbar{width:0}
.card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(20,26,36,.05),0 10px 24px -20px rgba(20,26,36,.5)}
.card.flush{padding:0;overflow:hidden}
h2{font-size:13px;font-weight:700;margin:0 0 2px}
.sub{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:22px 4px 8px}
.eyebrow:first-child{margin-top:4px}

.hero{background:var(--ink);color:#fff;border-radius:20px;padding:20px 16px 16px;margin-bottom:12px;text-align:center}
.ring{position:relative;width:176px;height:176px;margin:2px auto 6px}
.ring svg{transform:rotate(-90deg);display:block}
.ring .track{stroke:#2A3342}
.ring .prog{stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.7,.2,1)}
.ring .prog.short{stroke:#E4564A}
.ring .prog.met{stroke:#3FBE86}
.ring .cen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1}
.ring .big.short{color:#FF8A7A}
.ring .big.met{color:#5FD69B}
.ring .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8E99AD;margin-top:7px}
.ring .pct{font-family:var(--mono);font-size:12px;margin-top:5px}
.ring .pct.short{color:#FF8A7A}
.ring .pct.met{color:#5FD69B}
.split{display:flex;border-top:1px solid #2A3342;margin-top:12px;padding-top:12px}
.split div{flex:1}
.split div+div{border-left:1px solid #2A3342}
.split .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#8E99AD}
.split .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:3px}

.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--rule-soft);
  min-height:56px;background:var(--surface)}
.row:last-child{border-bottom:0}
.row.tap:active{background:#F4F7FA}
.row .lead{width:46px;flex:none;font-family:var(--mono);font-size:13px;line-height:1.2}
.row .lead b{display:block;font-size:15px;font-weight:600}
.row .lead i{font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.row .body{flex:1;min-width:0}
.row .body .t{font-size:14px}
.row .body .s{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:2px}
.row .tail{font-family:var(--mono);font-size:14px;text-align:right;flex:none}
.row.off{opacity:.5}
.row.hol{background:#FDF8EE}
.row.leave{background:#F2F7F6}
.chip{display:inline-block;font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:99px;
  border:1px solid var(--rule);color:var(--ink-2);background:#fff}
.chip.lv{border-color:#A9D5C9;color:var(--jade);background:#EEF7F4}
.chip.ph{border-color:#EBD9B4;color:#8A6A22;background:#FCF6EA}

.btn{display:block;width:100%;font-family:var(--display);font-weight:600;font-size:15px;border:0;border-radius:13px;
  padding:15px;background:var(--ink);color:#fff;cursor:pointer}
.btn:active{background:var(--ink-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--rule)}
.btn.danger{background:var(--surface);color:var(--red);border:1px solid #E7C5BF}
.btn+.btn{margin-top:9px}
.stepper{display:flex;align-items:center;border:1px solid var(--rule);border-radius:12px;overflow:hidden;flex:none}
.stepper button{width:42px;height:42px;border:0;background:var(--surface);font-size:20px;color:var(--ink);cursor:pointer}
.stepper button:active{background:#E9EEF4}
.stepper span{width:44px;text-align:center;font-family:var(--mono);font-size:16px;font-weight:600;
  border-left:1px solid var(--rule);border-right:1px solid var(--rule);line-height:42px}

.field{margin-bottom:12px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
input,select{width:100%;font-family:var(--display);font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule);border-radius:11px;padding:12px 13px}
input.num{font-family:var(--mono);text-align:right}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--marigold);outline-offset:1px}
.inline{display:flex;gap:9px;align-items:center}
.inline>*{flex:1}

.seg{display:grid;gap:7px}
.seg.c2{grid-template-columns:repeat(2,1fr)}
.seg.c3{grid-template-columns:repeat(3,1fr)}
.seg.c4{grid-template-columns:repeat(4,1fr)}
.seg button{padding:12px 6px;border-radius:12px;border:1px solid var(--rule);background:var(--surface);
  font-family:var(--display);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;line-height:1.25}
.seg button small{display:block;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--ink-3);margin-top:3px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button.on small{color:#9AA5B8}

.led{font-family:var(--mono);font-size:12.5px}
.led .l{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--rule-soft);align-items:baseline}
.led .l .op{width:12px;color:var(--ink-3);flex:none}
.led .l .d{flex:1;min-width:0}
.led .l .d small{display:block;font-family:var(--display);font-size:11px;color:var(--ink-3);line-height:1.35;margin-top:2px}
.led .l .a{flex:none;text-align:right;white-space:nowrap}
.led .l.zero{color:var(--ink-3)}
.led .l.tot{background:#F7F9FC;font-weight:600}
.led .l.grand{background:#FCF6EA;font-weight:600;font-size:14px}
.led .l.rule{border-bottom:1.5px solid var(--ink)}
.short{color:var(--red)!important}
.met{color:var(--green)!important}
.led .l.grand.short{background:#FBE9E7}
.led .l.grand.met{background:#E7F4EC}

.state{font-family:var(--mono);font-size:11px;line-height:1.5;padding:11px 13px;border-radius:12px;margin-bottom:12px}
.state.unsaved{background:#FCF6EA;color:#6B5424;border:1px solid #EBD9B4}
.state.stored{background:#E7F4EC;color:#0B5132;border:1px solid #A9D5C9}

.tabs{flex:none;display:flex;background:#fff;position:relative;z-index:2;
  border-top:1px solid var(--rule-soft);
  padding-bottom:max(env(safe-area-inset-bottom),6px)}
/* belt and braces: an explicit fixed layer over the bottom inset */
.safebottom{position:fixed;left:0;right:0;bottom:0;z-index:1;pointer-events:none;
  height:max(env(safe-area-inset-bottom),0px);background:#fff}
.tabs button{flex:1;border:0;background:transparent;padding:9px 2px 8px;cursor:pointer;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;gap:3px;height:var(--tabh)}
.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button span{font-family:var(--mono);font-size:9px}
.tabs button.on{color:var(--ink)}
.tabs button.on svg{stroke-width:2.1}

.scrim{position:fixed;inset:0;background:rgba(15,19,26,.45);opacity:0;pointer-events:none;transition:opacity .22s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-radius:22px 22px 0 0;z-index:21;
  transform:translateY(101%);transition:transform .28s cubic-bezier(.2,.75,.25,1);
  max-height:90%;overflow-y:auto;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px)}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--rule);margin:6px auto 14px}
.sheet h3{font-size:17px;margin:0 0 2px}
.sheet .sh-sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin:0 0 16px}
.full{position:fixed;inset:0;background:var(--paper);z-index:22;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.75,.25,1)}
.full.on{transform:translateX(0)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 18px);background:var(--ink);
  color:#fff;font-family:var(--mono);font-size:12px;padding:10px 16px;border-radius:11px;opacity:0;
  pointer-events:none;transition:opacity .25s;z-index:40;max-width:88%;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;padding:34px 20px;color:var(--ink-3)}
.empty svg{width:38px;height:38px;stroke:var(--rule);fill:none;stroke-width:1.5;margin-bottom:10px}
.empty p{font-size:13px;line-height:1.5;margin:0}
.hbar{height:6px;border-radius:99px;background:var(--rule-soft);overflow:hidden;margin-top:9px}
.hbar i{display:block;height:100%}
.hbar i.short{background:var(--red)}
.hbar i.met{background:var(--green)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;
  padding:0;border:0;border-radius:0;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--ink);border:3px solid #fff;box-shadow:0 1px 5px rgba(20,26,36,.4);margin-top:-12px}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--rule)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--ink);
  border:3px solid #fff;box-shadow:0 1px 5px rgba(20,26,36,.4)}
input[type=range]:focus-visible{outline:2px solid var(--marigold);outline-offset:4px}
.lock{position:fixed;inset:0;z-index:60;background:var(--ink);color:#fff;display:flex;
  -webkit-user-select:none;user-select:none;
  flex-direction:column;align-items:center;justify-content:center;padding:24px;
  padding-top:calc(env(safe-area-inset-top) + 24px)}
.lock.hide{display:none}
.lock h1{font-size:19px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.lock p{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:#8E99AD;margin:0 0 30px}
.dots{display:flex;gap:12px;margin-bottom:8px;height:16px;align-items:center}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid #4A5568;display:block;
  transition:background .12s,border-color .12s}
.dots i.on{background:#fff;border-color:#fff}
.lockmsg{font-family:var(--mono);font-size:11px;color:#8E99AD;height:18px;margin-bottom:22px}
.lockmsg.bad{color:#FF8A7A}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:14px;justify-content:center}
.pad button{height:78px;border-radius:50%;border:1px solid #2E3746;background:#1C2331;color:#fff;
  font-family:var(--mono);font-size:26px;font-weight:500;cursor:pointer;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pad button:active{background:#2A3342}
.pad button.wide{border:0;background:transparent;font-size:13px;font-family:var(--display);color:#8E99AD}
.shake{animation:shk .38s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
textarea.csvbox{width:100%;font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:11px;
  white-space:pre;overflow:auto;resize:vertical;-webkit-overflow-scrolling:touch}
.pctwrap{display:flex;gap:12px;align-items:center}
.pctwrap .sl{flex:1;min-width:0}
.pctwrap .bx{flex:0 0 92px}
.pctwrap .bx input{text-align:right;font-family:var(--mono);font-size:17px;font-weight:600;padding:11px 10px}
.pctscale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  color:var(--ink-3);margin:-6px 2px 0}
.ratecard{border:1px solid var(--rule-soft);border-radius:12px;padding:12px;margin-bottom:10px;background:#FBFCFD}
.ratetop{display:flex;gap:9px;align-items:center;margin-bottom:11px}
.ratetop input.code{flex:1;font-family:var(--mono);font-weight:600;font-size:15px;padding:10px 12px}
.ratetop button{flex:none;width:34px;height:34px;border:1px solid var(--rule);background:var(--surface);
  border-radius:9px;color:var(--ink-3);font-size:17px;line-height:1;cursor:pointer}
.ratetop button:active{background:#F1F4F8}
.rategrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rategrid .field{margin:0}
.rategrid input{padding:11px 10px;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <div class="lock" id="lock">
    <h1>Hours Ledger</h1>
    <p>Enter passcode</p>
    <div class="dots" id="dots"></div>
    <div class="lockmsg" id="lockmsg"></div>
    <div class="pad" id="pad"></div>
  </div>

  <div class="topbar">
    <button class="mbtn" id="prevM" aria-label="Previous month">‹</button>
    <div class="mtitle" id="ymPick" role="button" tabindex="0" style="cursor:pointer"><b id="ymLabel">—</b><span id="ymSub">hours ledger</span></div>
    <button class="mbtn" id="nextM" aria-label="Next month">›</button>
    <button class="gear" id="openSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <div class="screen" id="screen"></div>

  <div class="tabs" id="tabs">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Target</span></button>
    <button data-tab="days"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Days</span></button>
    <button data-tab="tasks"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h9"/></svg><span>Tasks</span></button>
    <button data-tab="calc"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h3M8 16h3M15 12v4"/></svg><span>Ledger</span></button>
    <button data-tab="hist"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span>History</span></button>
  </div>

  <div class="safebottom" aria-hidden="true"></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="full" id="settings"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   1. HK HOLIDAYS — injected at build time
   Gazetted 2023-2027 (gov.hk) + projected 2028-2046.
   ============================================================ */
const HOLIDAY_DATA = /*HOLIDAYS*/{};

/* ============================================================
   2. CONFIG
   ============================================================ */
const DEFAULT_RATES = [
  {code:'AL', full:'', monAM:4.75, monPM:3.75, othAM:4.25, othPM:3.5},
  {code:'SL', full:'', monAM:4.75, monPM:3.75, othAM:4.25, othPM:3.5},
  {code:'MA', full:'', monAM:4.75, monPM:3.5,  othAM:4.25, othPM:3.25},
  {code:'Other', full:'', monAM:4.75, monPM:3.75, othAM:4.25, othPM:3.5}
];
const DEFAULTS = {
  ver: 3,
  baseMon: 8, baseOther: 7.75,
  stretch: 0.167, stretchOnHalf: 'yes',
  deductWhen: 'After', mult: 105,
  rates: DEFAULT_RATES,
  holidays: HOLIDAY_DATA
};
let CFG = clone(DEFAULTS);
let M = null, SAVED = null, YM = '', HIST = {}, TAB = 'home', saveTimer = null, onLive = null;
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ============================================================
   3. STORAGE — Claude's artifact storage, else this device
   ============================================================ */
const STORE = (() => {
  if (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function')
    return {kind:'claude', get:k=>window.storage.get(k), set:(k,v)=>window.storage.set(k,v),
            del:k=>window.storage.delete(k), list:p=>window.storage.list(p)};
  const P = 'hoursledger:';
  return {
    kind:'device',
    async get(k){ const v=localStorage.getItem(P+k); if(v===null) throw new Error('missing'); return {key:k,value:v}; },
    async set(k,v){ localStorage.setItem(P+k,v); return {key:k,value:v}; },
    async del(k){ localStorage.removeItem(P+k); return {key:k,deleted:true}; },
    async list(p){ const out=[]; for(let i=0;i<localStorage.length;i++){ const raw=localStorage.key(i);
      if(raw&&raw.startsWith(P)){ const k=raw.slice(P.length); if(!p||k.startsWith(p)) out.push(k); } } return {keys:out}; }
  };
})();
async function sGet(k){ try{ const r=await STORE.get(k); return r?JSON.parse(r.value):null; }catch(e){ return null; } }
async function sSet(k,v){ try{ await STORE.set(k,JSON.stringify(v)); return true; }catch(e){ toast('Storage unavailable'); return false; } }
async function sDel(k){ try{ await STORE.del(k); }catch(e){} }
async function sList(p){ try{ const r=await STORE.list(p); return r?r.keys:[]; }catch(e){ return []; } }

/* ============================================================
   3b. PASSCODE LOCK
   A privacy curtain, not security: the page runs entirely on the
   device, so anyone with the file and the will can read the data.
   It stops a colleague picking up an unlocked phone. Only a salted
   hash is ever stored or shipped — never the passcode itself.
   ============================================================ */
function sha256(ascii){
  function rr(v,n){ return (v>>>n)|(v<<(32-n)); }
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
           0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
           0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
           0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
           0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
           0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
           0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
           0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes=[];
  for(let i=0;i<ascii.length;i++){
    let c=ascii.charCodeAt(i);
    if(c<128) bytes.push(c);
    else if(c<2048){ bytes.push(192|(c>>6),128|(c&63)); }
    else { bytes.push(224|(c>>12),128|((c>>6)&63),128|(c&63)); }
  }
  const bitLen=bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64!==56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push((bitLen/Math.pow(2,i*8))&255);
  const w=new Array(64);
  for(let b=0;b<bytes.length;b+=64){
    for(let i=0;i<16;i++)
      w[i]=(bytes[b+i*4]<<24)|(bytes[b+i*4+1]<<16)|(bytes[b+i*4+2]<<8)|bytes[b+i*4+3];
    for(let i=16;i<64;i++){
      const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3);
      const s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    let [a,b2,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25);
      const ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[i]+w[i])|0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22);
      const mj=(a&b2)^(a&c)^(b2&c);
      const t2=(S0+mj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b2; b2=a; a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+b2)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
}
const PASS_SALT = 'hours-ledger:v1:';
// sha256('hours-ledger:v1:' + <passcode supplied by the owner>)
const DEFAULT_PASS_HASH = '4c09f7ec076ad2ca5259f4f5059a8fb0048e6d4e640fe5fb62920fba7ce1b3de';
const PASS_LEN = 6;
const passHash = code => sha256(PASS_SALT + String(code));

const GRACE_DEFAULT = 600;   // 10 minutes — a quick trip to another app should not cost a passcode
let LOCK = {enabled:true, hash:DEFAULT_PASS_HASH, grace:GRACE_DEFAULT};
const BACKOFF = [0,0,0,5,15,30,60,120,300];   // seconds of delay per wrong attempt
let LOCKED = true;          // start locked; nothing is shown until the code is entered
let unlocking = null;       // in-flight prompt, so two events cannot stack two keypads
/** Grace is judged by comparing timestamps on return, never by a timer.
 *  iOS suspends timers the moment a page is backgrounded, so a setTimeout
 *  scheduled on hide simply never fires — which is why the passcode was
 *  being demanded after a one-second trip to another app. */
let seenMem = 0;      // survives a resume-from-memory even if no write landed
const SEEN_KEY = 'hoursledger:seen';
/** Session-scoped, deliberately. Closing the app ends the session and the
 *  stamp goes with it, so a fresh launch always asks for the passcode. */
function seenStored(){
  try{ return Number(sessionStorage.getItem(SEEN_KEY))||0; }catch(e){ return 0; }
}
function lastSeen(){ return Math.max(seenMem, seenStored()); }
function graceActive(){
  if(!LOCK.enabled || !(LOCK.grace>0)) return false;
  const t=lastSeen();
  return !!t && (Date.now()-t) < LOCK.grace*1000;
}
/** Stamp the moment of leaving. The synchronous localStorage write matters:
 *  a page being backgrounded may be frozen before an async write completes,
 *  which would lose the timestamp and demand the passcode on return. */
function markSeen(){
  seenMem = Date.now();
  // synchronous: a page being frozen may never finish an async write
  try{ sessionStorage.setItem(SEEN_KEY, String(seenMem)); }catch(e){}
}
function clearSeen(){
  seenMem = 0;
  try{ sessionStorage.removeItem(SEEN_KEY); }catch(e){}
}

function drawDots(n){
  const d=$('dots'); d.innerHTML='';
  for(let i=0;i<PASS_LEN;i++) d.appendChild(el('i', i<n?'on':''));
}
/** Resolves once the correct passcode is entered, or immediately if the lock is off. */
/** Put the lock up. Called the moment the page is hidden, so the passcode is
 *  already waiting when you come back — and so the iOS app-switcher preview
 *  shows the lock rather than your timesheet. */
function armLock(opts){
  if(!LOCK.enabled) return;
  const veilOnly = opts && opts.veilOnly;
  if(!veilOnly) LOCKED = true;
  const lk=$('lock');
  if(lk) lk.classList.remove('hide');
  const sh=$('sheet'), sc=$('scrim'), st=$('settings');
  if(sh) sh.classList.remove('on');
  if(sc) sc.classList.remove('on');
  if(st) st.classList.remove('on');
}
/** The single entry point: resolves only once the page may be shown. */
function gate(){
  if(!LOCK.enabled){ LOCKED=false; const lk=$('lock'); if(lk) lk.classList.add('hide'); return Promise.resolve(); }
  if(!LOCKED) return Promise.resolve();
  if(unlocking) return unlocking;
  unlocking = unlock().then(()=>{ LOCKED=false; unlocking=null; });
  return unlocking;
}

function unlock(){
  return new Promise(resolve=>{
    if(!LOCK.enabled){ $('lock').classList.add('hide'); resolve(); return; }
    $('lock').classList.remove('hide');
    let buf='', tries=Number(LOCK.tries)||0, timer=null;
    const msg=$('lockmsg'), pad=$('pad');
    drawDots(0);
    pad.innerHTML='';

    /** Wrong guesses cost increasing time, so a stolen phone cannot be
     *  walked through 10^6 codes by hand. Persisted, so reloading does not reset it. */
    const waitLeft=()=>Math.max(0, Math.ceil(((LOCK.until||0)-Date.now())/1000));
    const tick=()=>{
      const left=waitLeft();
      if(left>0){
        msg.textContent=`Too many attempts — wait ${left}s`;
        msg.className='lockmsg bad';
        pad.style.opacity='.35'; pad.style.pointerEvents='none';
        timer=setTimeout(tick,500);
      }else{
        pad.style.opacity=''; pad.style.pointerEvents='';
        if(timer){ msg.textContent=''; msg.className='lockmsg'; timer=null; }
      }
    };
    tick();

    const press=v=>{
      if(waitLeft()>0 || buf.length>=PASS_LEN) return;
      buf+=v; drawDots(buf.length); msg.textContent=''; msg.className='lockmsg';
      if(buf.length===PASS_LEN) setTimeout(check,120);
    };
    const check=async()=>{
      if(passHash(buf)===LOCK.hash){
        tries=0; LOCK.tries=0; LOCK.until=0; delete LOCK.seen; await sSet('lock',LOCK);
        markSeen();
        msg.textContent=''; 
        $('lock').classList.add('hide');
        resolve();
      }else{
        tries++; LOCK.tries=tries;
        const wait=BACKOFF[Math.min(tries,BACKOFF.length-1)];
        LOCK.until = wait ? Date.now()+wait*1000 : 0;
        await sSet('lock',LOCK);
        msg.textContent = wait ? `Wrong — wait ${wait}s` : 'Wrong passcode';
        msg.className='lockmsg bad';
        $('lock').classList.add('shake');
        setTimeout(()=>$('lock').classList.remove('shake'),400);
        buf=''; drawDots(0);
        if(wait) tick();
      }
    };
    /* pointerdown, not click: a click needs the browser to rule out a
       double-tap gesture first, which is exactly what swallowed a repeated
       digit. preventDefault stops the synthetic click that would follow. */
    const tap=(node,fn)=>{
      if(window.PointerEvent){
        node.addEventListener('pointerdown',e=>{ e.preventDefault(); fn(); });
      }else{
        node.addEventListener('touchstart',e=>{ e.preventDefault(); fn(); },{passive:false});
        node.addEventListener('click',fn);
      }
    };
    ['1','2','3','4','5','6','7','8','9'].forEach(n=>{
      const b=el('button',null,n); tap(b,()=>press(n)); pad.appendChild(b);
    });
    const del=el('button','wide','Delete');
    tap(del,()=>{ buf=buf.slice(0,-1); drawDots(buf.length); });
    const zero=el('button',null,'0'); tap(zero,()=>press('0'));
    pad.append(del,zero,el('button','wide',''));
    document.onkeydown=e=>{
      if(/^[0-9]$/.test(e.key)) press(e.key);
      else if(e.key==='Backspace'){ buf=buf.slice(0,-1); drawDots(buf.length); }
    };
  }).then(()=>{ document.onkeydown=null; });
}

/* ============================================================
   4. HELPERS
   ============================================================ */
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const r3=n=>Math.round(n*1000)/1000;
const f3=n=>(Math.abs(n)<0.0005?0:n).toFixed(3);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
function cleanDec(s){ s=String(s).replace(/[^0-9.]/g,''); const i=s.indexOf('.'); return i===-1?s:s.slice(0,i+1)+s.slice(i+1).replace(/\./g,''); }
function hm(n){ const s=n<0?'-':''; n=Math.abs(n); let h=Math.floor(n+1e-9), m=Math.round((n-h)*60); if(m===60){h++;m=0;} return `${s}${h}h ${String(m).padStart(2,'0')}m`; }
const labelYM=ym=>{const[y,m]=ym.split('-');return `${MN[+m-1]} ${y}`;};
const shortYM=ym=>{const[y,m]=ym.split('-');return `${MN[+m-1].slice(0,3)} ${y}`;};
const $=id=>document.getElementById(id);
/** Escape anything the user typed before it reaches innerHTML.
 *  Leave type codes, holiday names and notes are all editable, so each is a
 *  script-injection route if interpolated raw. */
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),2000); }

function numField(value,onChange,opts){
  opts=opts||{};
  const e=el('input'); e.type='text'; e.inputMode=opts.integer?'numeric':'decimal';
  e.autocomplete='off'; e.className='num'+(opts.cls?' '+opts.cls:'');
  e.placeholder=opts.placeholder||'0';
  e.value=(value===0||value==='0')&&opts.blankZero?'':(value??'');
  e.oninput=()=>{
    const c=e.selectionStart, before=e.value;
    let out=cleanDec(before); if(opts.integer) out=out.replace(/\./g,'');
    if(out!==before){ e.value=out; const s=before.length-out.length; try{e.setSelectionRange(c-s,c-s);}catch(x){} }
    onChange(out); onLive&&onLive();
  };
  e.onblur=()=>{ const n=num(e.value); e.value=(n===0&&opts.blankZero)?'':String(n); onChange(e.value); render(); };
  return e;
}

/* ============================================================
   5. ENGINE
   ============================================================ */
function holidayMap(y){
  const m={};
  (CFG.holidays[String(y)]||[]).forEach(h=>m[h[0]]={name:h[1], status:h[2]||'Projected'});
  return m;
}
function rateRow(code){
  return CFG.rates.find(r=>r.code===code) || CFG.rates[0] || {};
}
/** Hours deducted for a given day + leave record, from the rate table. */
function leaveDeduction(day){
  if(day.base===0 || !day.session) return 0;
  const r = rateRow(day.type);
  if(day.session==='Full'){
    const f = r.full;
    return (f===''||f==null) ? day.base : num(f);
  }
  const mon = day.w===1;
  if(day.session==='AM') return num(mon ? r.monAM : r.othAM);
  if(day.session==='PM') return num(mon ? r.monPM : r.othPM);
  return 0;
}
function buildDays(ym, rec){
  const [y,mo]=ym.split('-').map(Number), hol=holidayMap(y);
  const last=new Date(y,mo,0).getDate(), out=[];
  for(let d=1; d<=last; d++){
    const dt=new Date(y,mo-1,d), key=iso(dt), w=dt.getDay(), dr=(rec.days&&rec.days[key])||{};
    const isWeekend=(w===0||w===6);
    let isHol=!!hol[key];
    if(dr.ph===true) isHol=true;
    if(dr.ph===false) isHol=false;
    const base=isWeekend||isHol?0:(w===1?CFG.baseMon:CFG.baseOther);
    const day={key,d,w,wd:WD[w],isWeekend,isHol,
      holName:(hol[key]&&hol[key].name)||(dr.ph===true?'Marked holiday':''),
      holStatus:(hol[key]&&hol[key].status)||'',
      base, type:dr.type||(CFG.rates[0]&&CFG.rates[0].code)||'AL',
      session:dr.session||'', custom:num(dr.custom), ph:dr.ph};
    day.ded = leaveDeduction(day);
    out.push(day);
  }
  return out;
}
function compute(days, rec){
  const t={workDays:0,monDays:0,baseHours:0,holidayDays:0,weekendDays:0,
           fullDays:0,fullH:0,amDays:0,amH:0,pmDays:0,pmH:0,
           customDays:0,customH:0,extraH:num(rec.extraHours),
           stretchDays:0,stretchH:0,byType:{}};
  days.forEach(day=>{
    if(day.isWeekend){ t.weekendDays++; return; }
    if(day.isHol){ t.holidayDays++; return; }
    t.workDays++; if(day.w===1) t.monDays++;
    t.baseHours+=day.base;
    if(day.session==='Full'){ t.fullDays++; t.fullH+=day.ded; }
    else if(day.session==='AM'){ t.amDays++; t.amH+=day.ded; }
    else if(day.session==='PM'){ t.pmDays++; t.pmH+=day.ded; }
    if(day.custom>0){ t.customDays++; t.customH+=day.custom; }
    if(day.ded>0 || day.custom>0){
      t.byType[day.type]=r3((t.byType[day.type]||0)+day.ded+day.custom);
    }
    const attended = day.session!=='Full';
    const halfOK = (day.session==='AM'||day.session==='PM') ? CFG.stretchOnHalf==='yes' : true;
    if(attended && halfOK) t.stretchDays++;
  });
  t.baseHours=r3(t.baseHours);
  t.stretchH=r3(t.stretchDays*CFG.stretch);
  t.leaveH=r3(t.fullH+t.amH+t.pmH);
  t.deductions=r3(t.leaveH+t.customH+t.extraH+t.stretchH);
  // a month may carry its own multiplier; otherwise the default in Settings applies
  t.mult = (rec.mult!=='' && rec.mult!=null) ? num(rec.mult) : num(CFG.mult);
  t.multOverride = (rec.mult!=='' && rec.mult!=null && num(rec.mult)!==num(CFG.mult));
  t.scaled=r3(t.baseHours*(t.mult/100));
  // every deduction comes off AFTER the multiplier; Before mode scales them
  t.factor = CFG.deductWhen==='After' ? 1 : (t.mult/100);
  t.target=r3(t.scaled - t.deductions*t.factor);
  t.rounds=(rec.rounds||[]).map(r=>({...r, sub:r3(num(r.hours))}));
  t.roundCount=t.rounds.filter(r=>num(r.hours)>0).length;
  t.completed=r3(t.rounds.reduce((a,r)=>a+r.sub,0));
  t.remaining=r3(t.target-t.completed);       // positive = short
  t.pct=t.target>0?(t.completed/t.target*100):0;
  t.short=t.remaining>0.0005;
  return t;
}
const snap=()=>{const days=buildDays(YM,M); return {days,t:compute(days,M)};};

/* ============================================================
   6. RECORDS
   ============================================================ */
function emptyRecord(ym){ return {ym,days:{},extraHours:'',extraNote:'',rounds:[{label:'',hours:''}]}; }
function migrate(rec){
  if(!rec) return rec;
  // rounds used to carry a count; expand each into that many single rounds
  if(rec.rounds && rec.rounds.some(r=>r.count!==undefined)){
    const out=[];
    rec.rounds.forEach(r=>{
      if(r.count===undefined){ out.push(r); return; }
      const n=Math.round(num(r.count));
      for(let i=0;i<n;i++) out.push({label:r.label||'', hours:r.hours});
    });
    rec.rounds = out.length ? out : [{label:'',hours:''}];
  }
  // records written before leave types existed used {leave:'full'|'am'|'pm'}
  if(!rec.days) return rec;
  Object.values(rec.days).forEach(d=>{
    if(d.leave && !d.session){
      d.session = d.leave==='full'?'Full':d.leave==='am'?'AM':d.leave==='pm'?'PM':'';
      d.type = d.type || 'AL';
      delete d.leave;
    }
  });
  return rec;
}
function contentKey(rec){
  if(!rec) return null;
  return JSON.stringify({days:rec.days||{}, extraHours:String(rec.extraHours??''),
    extraNote:rec.extraNote||'', mult:String(rec.mult??''),
    rounds:(rec.rounds||[]).map(r=>[r.label||'',String(r.hours??'')])});
}
async function loadMonth(ym){
  YM=ym;
  const draft=migrate(await sGet('draft:'+ym));
  SAVED=migrate(await sGet('month:'+ym));
  M=draft||(SAVED?clone(SAVED):emptyRecord(ym));
  M.ym=ym;
  if(!M.rounds||!M.rounds.length) M.rounds=[{label:'',hours:''}];
  render();
}
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>sSet('draft:'+YM,M),700); }
async function saveToHistory(){
  const {t}=snap();
  const rec=clone(M);
  rec.savedAt=new Date().toISOString();
  rec.summary={workDays:t.workDays,baseHours:t.baseHours,scaled:t.scaled,leaveH:t.leaveH,
    customH:r3(t.customH+t.extraH),stretchH:t.stretchH,target:t.target,completed:t.completed,
    diff:r3(t.completed-t.target),pct:r3(t.pct),mult:t.mult,byType:t.byType};
  if(!await sSet('month:'+YM,rec)) return;
  SAVED=rec; HIST[YM]=rec.summary;
  await sSet('draft:'+YM,M);
  render(); toast(`${shortYM(YM)} saved to history`);
}
async function removeFromHistory(ym){
  await sDel('month:'+ym); delete HIST[ym];
  if(ym===YM) SAVED=null;
  render(); toast(`${shortYM(ym)} removed`);
}
async function loadHistory(){
  HIST={};
  for(const k of await sList('month:')){
    const rec=await sGet(k);
    if(rec&&rec.summary) HIST[k.replace('month:','')]=rec.summary;
  }
}

/* ============================================================
   7. SCREENS
   ============================================================ */
/** Month and year dropdowns, reusable wherever navigation is wanted. */
function monthPicker(){
  const wrap=el('div','inline');
  const [cy,cm]=YM.split('-').map(Number);
  const mf=el('div','field'); mf.style.marginBottom='0';
  mf.appendChild(el('label',null,'Month'));
  const ms=el('select');
  MN.forEach((n,i)=>{ const o=el('option',null,n); o.value=i+1; if(i+1===cm) o.selected=true; ms.appendChild(o); });
  mf.appendChild(ms);
  const yf=el('div','field'); yf.style.marginBottom='0'; yf.style.flex='0 0 104px';
  yf.appendChild(el('label',null,'Year'));
  const ys=el('select');
  const years=Object.keys(CFG.holidays).map(Number).sort((a,b)=>a-b);
  if(!years.includes(cy)) years.push(cy);
  years.sort((a,b)=>a-b).forEach(y=>{ const o=el('option',null,y); o.value=y; if(y===cy) o.selected=true; ys.appendChild(o); });
  yf.appendChild(ys);
  const go=()=>loadMonth(`${ys.value}-${String(ms.value).padStart(2,'0')}`);
  ms.onchange=go; ys.onchange=go;

function setDay(key,field,val,quiet){
  M.days=M.days||{};
  M.days[key]=M.days[key]||{};
  M.days[key][field]=val;
  prune(key);
  queueSave();
  if(!quiet) render();
}
/** Drop a day record only when it carries nothing worth keeping.
 *  A leave type on its own IS worth keeping — it lets you pick the type
 *  before the session, in either order. */
function prune(key){
  const d=M.days[key];
  if(!d) return;
  if(d.session || num(d.custom) || d.ph!==undefined) return;
  const dflt=(CFG.rates[0]&&CFG.rates[0].code)||'AL';
  if(d.type && d.type!==dflt) return;          // a deliberate non-default choice
  delete M.days[key];
}

function ledgerText(){
  const {t}=snap(), L=[], sc=v=>f3(r3(v*t.factor));
  L.push(`HOURS LEDGER — ${labelYM(YM)}`);
  L.push(`Work days ${t.workDays} (Mon ${t.monDays}) | PH ${t.holidayDays}`);
  L.push(`Base hours              ${f3(t.baseHours)}`);
  L.push(`x ${t.mult}%${t.multOverride?' (this month)':''}      ${f3(t.scaled)}`);
  L.push(`- Full-day leave (${t.fullDays})    ${sc(t.fullH)}`);
  L.push(`- Half-day AM    (${t.amDays})    ${sc(t.amH)}`);
  L.push(`- Half-day PM    (${t.pmDays})    ${sc(t.pmH)}`);
  L.push(`- Custom hours   (${t.customDays})    ${sc(t.customH)}`);
  L.push(`- Ad-hoc leave            ${sc(t.extraH)}`);
  L.push(`- Stretch (${t.stretchDays} x ${CFG.stretch})   ${sc(t.stretchH)}`);
  L.push(`= TARGET                ${f3(t.target)}  (${hm(t.target)})`);
  L.push(`Completed (${t.roundCount})          ${f3(t.completed)}`);
  L.push(`${t.short?'STILL NEEDED':'SURPLUS'}            ${f3(Math.abs(t.remaining))}  (${t.pct.toFixed(1)}%)`);
  Object.keys(t.byType).forEach(k=>L.push(`  ${k} leave: ${f3(t.byType[k])} h`));
  return L.join('\n');
}

      </div>`;

/** Build the history CSV. Per-leave-type columns are added for whatever types appear. */
function historyCSV(){
  const keys=Object.keys(HIST).sort();
  const types=[];
  keys.forEach(ym=>Object.keys(HIST[ym].byType||{}).forEach(t=>{ if(!types.includes(t)) types.push(t); }));
  types.sort();
  const head=['Month','Work days','Base hours','Target %','Base x %','Leave h','Custom+adhoc h',
              'Stretch h','Target h','Completed h','Difference h','% of target','Result',
              ...types.map(t=>t+' h')];
  const esc=v=>{ const t=String(v); return /[",\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t; };
  const rows=keys.map(ym=>{
    const s=HIST[ym];
    return [labelYM(ym), s.workDays, f3(s.baseHours), s.mult??num(CFG.mult), f3(s.scaled||0),
            f3(s.leaveH), f3(s.customH||0), f3(s.stretchH), f3(s.target), f3(s.completed),
            f3(s.diff), f3(s.pct), s.diff>=0?'met':'short',
            ...types.map(t=>f3((s.byType||{})[t]||0))].map(esc);
  });
  return [head.map(esc),...rows].map(r=>r.join(',')).join('\r\n');
}

/** Export is offered three ways, because a single one cannot be relied on:
 *  in-app browsers and sandboxed frames block downloads outright, and iOS
 *  handles blob downloads inconsistently. Copy always works. */
async function exportCSV(){
  const keys=Object.keys(HIST);
  if(!keys.length){ toast('Nothing to export — save a month first'); return; }
  const csv=historyCSV();
  const name=`hours-history-${new Date().toISOString().slice(0,10)}.csv`;
  const sh=$('sheet'); sh.innerHTML='';
  sh.appendChild(el('div','grab'));
  sh.appendChild(el('h3',null,'Export history'));
  sh.appendChild(el('p','sh-sub',`${keys.length} month${keys.length===1?'':'s'} · ${name}`));

  const status=el('div','state stored'); status.style.display='none'; sh.appendChild(status);
  const say=(msg,bad)=>{ status.className='state '+(bad?'unsaved':'stored');
                         status.textContent=msg; status.style.display='block'; };

  // Share sheet — the most reliable route on iOS, when the browser offers it
  let file=null;
  try{ file=new File([csv],name,{type:'text/csv'}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    const b=el('button','btn','Share / Save to Files');
    b.onclick=async()=>{
      try{ await navigator.share({files:[file],title:'Hours history'}); say('Shared.'); }
      catch(e){ if(e && e.name!=='AbortError') say('Share was blocked here — use Copy below.',true); }
    };
    sh.appendChild(b);
  }

  const dl=el('button','btn ghost','Download file');
  dl.onclick=()=>{
    try{
      const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=name; a.rel='noopener';
      document.body.appendChild(a);          // detached anchors are ignored by some browsers
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);   // revoking at once cancels the download
      say('Download started. If nothing arrived, this browser blocks downloads — use Copy instead.');
    }catch(e){ say('Download blocked here — use Copy below.',true); }
  };
  sh.appendChild(dl);

  const cp=el('button','btn ghost','Copy to clipboard');
  cp.onclick=async()=>{
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(csv); }
      else { box.select(); document.execCommand('copy'); }
      say('Copied. Paste into a spreadsheet and save as .csv');
    }catch(e){
      box.select(); say('Select the text below and copy it manually.',true);
    }
  };
  sh.appendChild(cp);

  sh.appendChild(el('p','eyebrow','Or copy the text directly'));
  const box=el('textarea','csvbox'); box.value=csv; box.readOnly=true; box.rows=8;
  box.onclick=()=>box.select();
  sh.appendChild(box);

  const done=el('button','btn ghost','Done'); done.style.marginTop='10px';
  done.onclick=closeSheet; sh.appendChild(done);
  $('scrim').classList.add('on'); sh.classList.add('on');
}

/* ============================================================
   7b. BACKUP AND RESTORE
   Browser storage is scoped to one browser on one device. Nothing
   in a static page can cross that boundary, so the answer is a file
   you carry: export it to iCloud/Drive, restore it anywhere.
   ============================================================ */
async function buildBackup(){
  const months={}, drafts={};
  for(const k of await sList('month:')) months[k.replace('month:','')]=await sGet(k);
  for(const k of await sList('draft:')) drafts[k.replace('draft:','')]=await sGet(k);
  return {app:'hours-ledger', schema:1, exportedAt:new Date().toISOString(),
          config:CFG,
          lock:{enabled:LOCK.enabled, hash:LOCK.hash, grace:LOCK.grace, graceSet:LOCK.graceSet},
          months, drafts};
}
/** mode 'merge' keeps whichever copy of a month was saved later; 'replace'
 *  wipes what is here first. Merge is the safe default. */
async function restoreBackup(obj, mode){
  if(!obj || obj.app!=='hours-ledger') throw new Error('That is not a Hours Ledger backup file');
  if(mode==='replace'){
    for(const k of await sList('month:')) await sDel(k);
    for(const k of await sList('draft:')) await sDel(k);
  }
  let added=0, updated=0, kept=0;
  for(const [ym,rec] of Object.entries(obj.months||{})){
    if(!rec || !rec.summary) continue;
    const cur=await sGet('month:'+ym);
    if(!cur){ await sSet('month:'+ym,rec); added++; }
    else if(mode==='replace' || String(rec.savedAt||'')>String(cur.savedAt||'')){
      await sSet('month:'+ym,rec); updated++;
    } else kept++;
  }
  for(const [ym,rec] of Object.entries(obj.drafts||{})){
    if(!rec) continue;
    if(mode==='replace' || !(await sGet('draft:'+ym))) await sSet('draft:'+ym,rec);
  }
  if(obj.config){ CFG=Object.assign(clone(DEFAULTS), obj.config); await sSet('config',CFG); }
  if(obj.lock && obj.lock.hash){
    LOCK.enabled=obj.lock.enabled!==false; LOCK.hash=obj.lock.hash;
    LOCK.grace=Number(obj.lock.grace)||GRACE_DEFAULT; LOCK.graceSet=!!obj.lock.graceSet;
    await sSet('lock',LOCK);
  }
  await loadHistory();
  await loadMonth(YM);
  return {added,updated,kept};
}

function openBackupSheet(){
  const sh=$('sheet'); sh.innerHTML='';
  sh.appendChild(el('div','grab'));
  sh.appendChild(el('h3',null,'Backup & restore'));
  sh.appendChild(el('p','sh-sub','carry your history between browsers and devices'));

  const status=el('div','state stored'); status.style.display='none'; sh.appendChild(status);
  const say=(m,bad)=>{ status.className='state '+(bad?'unsaved':'stored');
                       status.textContent=m; status.style.display='block'; };

  const why=el('p','sub');
  why.style.margin='0 0 14px';
  why.textContent='Saved months live in this browser only. Another browser, another device or '
    +'cleared site data starts empty. Export a backup and restore it there.';
  sh.appendChild(why);

  const exp=el('button','btn','Export backup file');
  exp.onclick=async()=>{
    const data=JSON.stringify(await buildBackup(),null,1);
    const name=`hours-ledger-backup-${new Date().toISOString().slice(0,10)}.json`;
    let file=null;
    try{ file=new File([data],name,{type:'application/json'}); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'Hours Ledger backup'});
           say('Shared. Save it to Files, iCloud Drive or your company Drive.'); return; }
      catch(e){ if(e && e.name==='AbortError') return; }
    }
    try{
      const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
      const a=document.createElement('a'); a.href=url; a.download=name; a.rel='noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      say('Download started. If nothing arrived, copy the text below instead.');
    }catch(e){ say('Download blocked here — copy the text below.',true); }
  };
  sh.appendChild(exp);

  const cp=el('button','btn ghost','Copy backup text');
  cp.onclick=async()=>{
    const data=JSON.stringify(await buildBackup());
    try{ await navigator.clipboard.writeText(data); say('Copied. Paste it into the box on the other device.'); }
    catch(e){ box.value=data; box.select(); say('Select the text below and copy it.',true); }
  };
  sh.appendChild(cp);

  sh.appendChild(el('p','eyebrow','Restore'));
  let mode='merge';
  const seg=el('div','seg c2');
  [['merge','Merge','keeps the newer copy'],['replace','Replace','wipes what is here']].forEach(([v,l,d])=>{
    const b=el('button',mode===v?'on':'',`${l}<small>${d}</small>`);
    b.onclick=()=>{ mode=v; [...seg.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); };
    seg.appendChild(b);
  });
  sh.appendChild(seg);

  const doRestore=async(text)=>{
    try{
      const res=await restoreBackup(JSON.parse(text), mode);
      say(`Restored: ${res.added} month(s) added, ${res.updated} updated, ${res.kept} already newer here.`);
      render();
    }catch(e){ say(e.message||'Could not read that backup.',true); }
  };

  const pick=el('button','btn ghost','Choose a backup file');
  pick.style.marginTop='9px';
  pick.onclick=()=>{
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='application/json,.json';
    inp.onchange=()=>{
      const f=inp.files && inp.files[0];
      if(!f) return;
      const r=new FileReader();
      r.onload=()=>doRestore(String(r.result));
      r.onerror=()=>say('Could not read that file.',true);
      r.readAsText(f);
    };
    inp.click();
  };
  sh.appendChild(pick);

  sh.appendChild(el('p','eyebrow','Or paste backup text'));
  const box=el('textarea','csvbox'); box.rows=6; box.placeholder='{"app":"hours-ledger", ...}';
  sh.appendChild(box);
  const past=el('button','btn ghost','Restore from pasted text');
  past.style.marginTop='9px';
  past.onclick=()=>{ if(!box.value.trim()){ say('Paste a backup first.',true); return; } doRestore(box.value); };
  sh.appendChild(past);

  const note=el('p','sub'); note.style.margin='14px 0 0';
  note.textContent='The backup holds your leave, tasks, settings and the passcode hash in readable '
    +'text. Keep it somewhere you would keep a timesheet.';
  sh.appendChild(note);

  const done=el('button','btn ghost','Done'); done.style.marginTop='10px';
  done.onclick=closeSheet; sh.appendChild(done);
  $('scrim').classList.add('on'); sh.classList.add('on');
}

(async function init(){
  try{ localStorage.removeItem(SEEN_KEY); }catch(e){}   // drop the old durable stamp
  const lk=await sGet('lock');
  if(lk && typeof lk.enabled==='boolean'){
    LOCK.enabled=lk.enabled; LOCK.hash=lk.hash||DEFAULT_PASS_HASH;
    // graceSet is only true once the person has picked a value themselves.
    // Without it, any stored grace came from an older default and is ignored.
    LOCK.grace = lk.graceSet ? (Number(lk.grace)||0) : GRACE_DEFAULT;
    LOCK.graceSet = !!lk.graceSet;
    LOCK.tries=lk.tries; LOCK.until=lk.until;
    delete LOCK.seen;                       // legacy field: a close must not be forgiven
  }
  // a reload inside the grace window should not ask again either
  if(graceActive()){ LOCKED=false; $('lock').classList.add('hide'); } else { await gate(); }
  const saved=await sGet('config');
  if(saved){
    CFG=Object.assign(clone(DEFAULTS),saved);
    if(!saved.ver || saved.ver<DEFAULTS.ver){
      CFG.rates = saved.rates && saved.rates.length ? saved.rates : clone(DEFAULT_RATES);
      CFG.holidays = Object.assign({}, saved.holidays||{}, clone(HOLIDAY_DATA));
      CFG.deductWhen = saved.deductWhen || 'After';
      CFG.ver = DEFAULTS.ver;
      await sSet('config',CFG);
      setTimeout(()=>toast('Updated: leave types, holidays to 2046'),600);
    }
  }
  await loadHistory();
  const n=new Date();
  await loadMonth(`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`);

  /* Re-lock on every route back into the page.
     A reload is not the only way in: iOS resumes a Home Screen app from memory
     and Safari restores from the back/forward cache, in both cases without
     re-running startup. Each of these events is a separate way back, so each
     one has to be covered. */
  const leaving = ()=>{
    markSeen();                              // stamp the moment of leaving
    // Cover the screen either way, so the iOS app-switcher snapshot never
    // shows the timesheet. Within grace it is a veil that lifts on return;
    // beyond grace it is the real lock.
    armLock(LOCK.grace>0 ? {veilOnly:true} : undefined);
  };
  const returning = ()=>{
    if(graceActive()){                       // back within the window: just lift the veil
      LOCKED=false;
      $('lock').classList.add('hide');
      markSeen();
      render();
      return;
    }
    LOCKED=true;
    armLock();
    gate().then(()=>render());
  };

  document.addEventListener('visibilitychange', ()=>{
    document.visibilityState==='hidden' ? leaving() : returning();
  });
  window.addEventListener('pagehide', leaving);            // navigating away, app suspending
  window.addEventListener('blur', markSeen);               // focus lost before any hide fires
  window.addEventListener('beforeunload', markSeen);
  window.addEventListener('pageshow', ()=>returning());    // includes back/forward cache restores
  window.addEventListener('freeze', leaving);              // browser discarding the tab
  window.addEventListener('resume', returning);
})();
</script>
